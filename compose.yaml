services:
  asha:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      ASHA_DATA_DIR: /data
      ASHA_ALLOWED_ORIGINS: https://appassets.androidplatform.net
    volumes:
      - asha-data:/data
    security_opt:
      - no-new-privileges:true
volumes:
  asha-data:
